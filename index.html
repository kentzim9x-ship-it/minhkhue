<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINHKHUE - LMS v3.0</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Jost:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="index.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Export by Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 7l7-5 7 5v7H1V7z" />
            <rect x="5" y="10" width="6" height="4" />
            <line x1="8" y1="10" x2="8" y2="14" />
          </svg>
        </div>
        <div>
          <div class="brand-title">MINHKHUE</div>
          <div class="brand-subtitle">LMS v3.0</div>
        </div>
      </div>

      <nav class="nav-menu">
        <div class="nav-group">
          <button class="nav-btn active" data-view="dashboard">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="1" y="1" width="6" height="6" rx="0.5" />
              <rect x="9" y="1" width="6" height="6" rx="0.5" />
              <rect x="1" y="9" width="6" height="6" rx="0.5" />
              <rect x="9" y="9" width="6" height="6" rx="0.5" />
            </svg>
            Tổng Quan
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Danh Mục</div>
          <button class="nav-btn" data-view="materials">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M2 5l6-3 6 3v6l-6 3-6-3V5z" />
              <path d="M8 2v12M2 5l6 3 6-3" />
            </svg>
            Danh Mục Hàng Hóa
          </button>
          <button class="nav-btn" data-view="customers">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="6" cy="5" r="3" />
              <path d="M1 14c0-3 2-5 5-5s5 2 5 5" />
              <path d="M11 3a3 3 0 010 6M15 14c0-2.5-1.5-4.5-4-5" />
            </svg>
            Danh Mục Khách Hàng
          </button>
          <button class="nav-btn" data-view="warehouses">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 7l7-5 7 5v7H1V7z" />
              <rect x="5" y="10" width="6" height="4" />
              <line x1="8" y1="10" x2="8" y2="14" />
            </svg>
            Danh Mục Kho
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Chức Năng (Phiếu)</div>
          <button class="nav-btn" data-view="quotations">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 2h7l3 3v9H3V2z" />
              <path d="M10 2v3h3" />
              <line x1="5" y1="8" x2="11" y2="8" />
              <line x1="5" y1="11" x2="9" y2="11" />
            </svg>
            Bảng Báo Giá
          </button>
          <button class="nav-btn" data-view="sales-orders">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 1h2l2 8h7l2-5H5" />
              <circle cx="6.5" cy="12.5" r="1" fill="currentColor" stroke="none" />
              <circle cx="12.5" cy="12.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            Đơn Hàng Bán
          </button>
          <button class="nav-btn" data-view="returns">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 8H13M3 8l3-3M3 8l3 3" />
              <path d="M13 4v8" />
            </svg>
            Đổi Trả Hàng Bán
          </button>
          <button class="nav-btn" data-view="grn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="10" height="12" rx="0.5" />
              <path d="M6 3V2h4v1" />
              <line x1="5" y1="7" x2="11" y2="7" />
              <line x1="5" y1="10" x2="9" y2="10" />
            </svg>
            Phiếu Nhập Kho
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Báo Cáo</div>
          <button class="nav-btn" data-view="report-inventory">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 12l4-5 3 3 4-6 3 2" />
              <line x1="1" y1="14" x2="15" y2="14" />
            </svg>
            Báo Cáo Tồn Kho
          </button>
          <button class="nav-btn" data-view="report-sales">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 12l4-5 3 3 4-6 3 2" />
              <line x1="1" y1="14" x2="15" y2="14" />
            </svg>
            Báo Cáo Bán Hàng
          </button>
        </div>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar">MA</div>
        <div>
          <div class="user-name">Marcus Avery</div>
          <div class="user-role">ADMIN</div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="app-header">
        <div class="header-title-container">
          <span id="view-tag" class="view-tag">OVERVIEW</span>
          <span id="view-title" class="view-title">Overview</span>
        </div>
        <div class="header-meta">
          <span class="header-date" id="header-date">-- --- ----</span>
          <button class="bell-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 13a2 2 0 004 0" />
              <path d="M8 1a5 5 0 00-5 5v2l-1 2h12l-1-2V6a5 5 0 00-5-5z" />
            </svg>
            <span class="bell-badge"></span>
          </button>
        </div>
      </header>

      <main id="app-content" class="main-content"></main>
    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
