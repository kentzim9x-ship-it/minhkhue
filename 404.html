<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MINHKHUE - LMS Redirecting...</title>
  <script type="text/javascript">
    var pathSegmentsToKeep = 1; // Giữ lại tiền tố /minhkhue/
    var l = window.location;
    
    var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    var isDetail = /\/(add|edit|view)(\/|$)/i.test(path);
    var targetPage = isDetail ? 'detail.html' : '';

    // Đẩy URL thành dạng /minhkhue/?p=materials hoặc /minhkhue/detail.html?p=materials/view/SKU-0075
    l.replace(
      l.protocol + '//' + l.host + '/' +
      l.pathname.split('/')[1] + '/' + targetPage +
      '?p=' + encodeURIComponent(path + l.search) + l.hash
    );
  </script>
</head>
<body>
</body>
</html>
